<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GroundCheck turns the next hours of weather into GO, CAUTION or NO-GO for outdoor tasks like spraying, digging and pruning." />
    <meta name="theme-color" content="#fcceb4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GroundCheck</title>
    <script>
      // Apply the saved or system theme before the first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('gc.theme'));
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }

      // Desktop frames are 1280 px wide: scale them down evenly to 80 % at 1024 px (see global.css).
      function setDesktopScale() {
        var scale = Math.min(1, Math.max(0.8, window.innerWidth / 1280));
        document.documentElement.style.setProperty('--desktop-scale', String(scale));
      }
      setDesktopScale();
      window.addEventListener('resize', setDesktopScale);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
